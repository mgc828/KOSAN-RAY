<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="t">
  <title id="t">Maskot kost-kostan: rumah kost yang tersenyum sambil memegang kunci</title>
  <ellipse cx="160" cy="296" rx="96" ry="12" fill="#0F2A43" opacity="0.18"/>
  <!-- badan rumah -->
  <rect x="58" y="128" width="204" height="160" rx="26" fill="#FFFFFF"/>
  <!-- atap -->
  <path d="M34 142 L160 40 L286 142 Q290 150 280 152 L40 152 Q30 150 34 142 Z" fill="#0F2A43"/>
  <path d="M160 40 L286 142 Q290 150 280 152 L160 152 Z" fill="#16385A"/>
  <rect x="224" y="52" width="28" height="52" rx="6" fill="#0F2A43"/>
  <!-- jendela bulat di atap -->
  <circle cx="160" cy="104" r="17" fill="#FDBA74"/>
  <circle cx="160" cy="104" r="17" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <!-- mata -->
  <ellipse cx="124" cy="196" rx="13" ry="16" fill="#0F2A43"/>
  <ellipse cx="196" cy="196" rx="13" ry="16" fill="#0F2A43"/>
  <circle cx="128" cy="190" r="5" fill="#FFFFFF"/>
  <circle cx="200" cy="190" r="5" fill="#FFFFFF"/>
  <!-- pipi -->
  <circle cx="98" cy="226" r="12" fill="#FDBA74" opacity="0.85"/>
  <circle cx="222" cy="226" r="12" fill="#FDBA74" opacity="0.85"/>
  <!-- senyum -->
  <path d="M134 224 Q160 252 186 224" fill="none" stroke="#0F2A43" stroke-width="7" stroke-linecap="round"/>
  <!-- lengan memegang kunci -->
  <path d="M262 232 Q292 224 296 196" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <g transform="translate(296 176) rotate(18)">
    <circle cx="0" cy="-10" r="15" fill="#F97316" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="0" cy="-10" r="5" fill="#FFFFFF"/>
    <rect x="-4" y="4" width="8" height="40" rx="3" fill="#F97316" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="4" y="26" width="12" height="7" rx="2" fill="#F97316" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="4" y="37" width="9" height="7" rx="2" fill="#F97316" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- lengan kiri melambai -->
  <path d="M58 232 Q28 232 22 196" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- kaki -->
  <rect x="106" y="278" width="40" height="18" rx="9" fill="#0F2A43"/>
  <rect x="174" y="278" width="40" height="18" rx="9" fill="#0F2A43"/>
</svg>
